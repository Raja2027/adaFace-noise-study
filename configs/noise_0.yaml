experiment:
  name: "full_webface_noise_0"
  noise_percentage: 0

data:
  rec_path: "data/raw/faces_webface_112x112/train.rec"
  idx_path: "data/raw/faces_webface_112x112/train.idx"
  label_map_path: "data/metadata/record_label_map.csv"

model:
  backbone: "ir_50"
  embedding_size: 512
  classnum: 10572  # CASIA-WebFace identities
  adaface_m: 0.4
  adaface_h: 0.333
  adaface_s: 64.0
  adaface_t_alpha: 0.01

training:
  seed: 42
  batch_size: 256  # Physical batch size on Colab GPU. Tune with benchmarking.
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  epochs: 26
  lr_milestones: [12, 20, 24]
  lr_gamma: 0.1
  num_workers: 4
  checkpoint_freq: 5
